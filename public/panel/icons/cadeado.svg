<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFE66D"/>
      <stop offset="45%" stop-color="#FFD21F"/>
      <stop offset="100%" stop-color="#F2A900"/>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="6"
        stdDeviation="6"
        flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- Arco do cadeado -->
  <path
    d="M78 116V82c0-28 22-50 50-50s50 22 50 50v34"
    fill="none"
    stroke="url(#gold)"
    stroke-width="24"
    stroke-linecap="round"
    filter="url(#shadow)"
  />

  <!-- Corpo do cadeado -->
  <rect
    x="48"
    y="104"
    width="160"
    height="120"
    rx="24"
    fill="url(#gold)"
    filter="url(#shadow)"
  />

  <!-- Fechadura -->
  <circle
    cx="128"
    cy="153"
    r="17"
    fill="#8A6100"
  />

  <rect
    x="119"
    y="153"
    width="18"
    height="43"
    rx="9"
    fill="#8A6100"
  />

  <!-- Brilho -->
  <path
    d="M73 128c0-7 6-13 13-13h84"
    fill="none"
    stroke="#FFF4A3"
    stroke-width="7"
    stroke-linecap="round"
    opacity=".75"
  />
</svg>